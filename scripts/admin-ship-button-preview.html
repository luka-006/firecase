<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin – Potvrdi slanje</title>
  <style>
    body { margin: 0; background: #0a0a0a; color: #e8e4df; font-family: Montserrat, system-ui, sans-serif; padding: 24px; }
    .card { background: #141414; border: 1px solid #262626; border-radius: 12px; padding: 20px; max-width: 720px; }
    h2 { font-size: 16px; margin: 0 0 16px; display: flex; align-items: center; gap: 12px; }
    .step { width: 24px; height: 24px; background: #f97316; color: #0a0a0a; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
    .btn { background: #f97316; color: #0a0a0a; border: none; padding: 10px 18px; border-radius: 999px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h2><span class="step">2</span> Potvrdi slanje</h2>
    <button class="btn" type="button">Potvrdi slanje</button>
  </div>
</body>
</html>
