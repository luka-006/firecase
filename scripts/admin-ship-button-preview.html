<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin – Potvrdi slanje (preview)</title>
  <style>
    body { margin: 0; background: #0a0a0a; color: #e8e4df; font-family: Montserrat, system-ui, sans-serif; padding: 24px; }
    .card { background: #141414; border: 1px solid #262626; border-radius: 12px; padding: 20px; max-width: 720px; }
    h2 { font-size: 16px; margin: 0 0 16px; display: flex; align-items: center; gap: 12px; }
    .step { width: 24px; height: 24px; background: #f97316; color: #0a0a0a; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
    .label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #a8a29e; margin-bottom: 6px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
    .field { flex: 1; min-width: 200px; }
    input, select { width: 100%; box-sizing: border-box; background: #1a1a1a; border: 1px solid #333; color: #e8e4df; padding: 10px 12px; border-radius: 8px; font: inherit; }
    .btn { background: #f97316; color: #0a0a0a; border: none; padding: 10px 18px; border-radius: 999px; font-weight: 600; cursor: pointer; }
    .confirm { margin-top: 16px; padding: 16px; border: 1px solid rgba(249,115,22,0.4); background: rgba(249,115,22,0.1); border-radius: 8px; font-size: 14px; }
    .muted { color: #a8a29e; font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h2><span class="step">2</span> Potvrdi slanje i obavijesti kupca</h2>
    <div class="row">
      <div class="field"><span class="label">Dostavna služba</span><select><option>Cainiao / AliExpress Standard</option></select></div>
      <div class="field"><span class="label">Broj za praćenje *</span><input value="LP123456789HR" /></div>
      <div class="field"><span class="label">Poveznica za praćenje (neobavezno)</span><input value="https://t.17track.net/en#nums=LP123456789HR" /></div>
    </div>
    <button class="btn" type="button">Potvrdi slanje</button>
    <div class="confirm">
      <strong>Poslati narudžbu i obavijestiti kupca e-mailom?</strong>
      <p class="muted">Status postaje „Poslano”. Ova akcija šalje e-mail samo jednom; ponovno slanje je zasebna akcija.</p>
      <button class="btn" type="button">Da, potvrdi slanje</button>
    </div>
  </div>
</body>
</html>
