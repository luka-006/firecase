<!DOCTYPE html>
<html lang="hr"><head><meta charset="utf-8"/><title>Prijava kodom</title>
<style>body{margin:0;min-height:100vh;background:#0a0a0a;color:#e8e4df;font-family:Montserrat,system-ui,sans-serif;display:grid;place-items:center;padding:24px}.box{max-width:400px;width:100%}.input{width:100%;box-sizing:border-box;background:#141414;border:1px solid #333;color:#e8e4df;padding:12px;border-radius:8px;margin:8px 0 16px;font:inherit}.btn{width:100%;background:#f97316;color:#0a0a0a;border:none;padding:14px;border-radius:999px;font-weight:600;font:inherit}.label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#888}.cf{height:65px;background:#141414;border:1px dashed #333;border-radius:8px;margin:12px 0;display:grid;place-items:center;color:#666;font-size:12px}</style></head>
<body><div class="box"><h1 style="font-size:24px">Prijava</h1>
<span class="label">E-mail</span><input class="input" value="kupac@example.com"/>
<div class="cf">Cloudflare Turnstile</div>
<button class="btn">Pošalji kod</button>
<hr style="border-color:#262626;margin:32px 0"/>
<span class="label">Kod iz e-maila</span><input class="input" value="482913" inputmode="numeric"/>
<button class="btn">Potvrdi i nastavi</button></div></body></html>
